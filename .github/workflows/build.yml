name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.4-${{ matrix.os }}

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A x64

      - name: Configure (macOS universal)
        if: runner.os == 'macOS'
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Package
        shell: bash
        run: |
          OUT="HipHopBeatMaker-${{ matrix.name }}"
          mkdir -p "$OUT"
          cp -R "build/HipHopBeatMaker_artefacts/Release/VST3/Hip-Hop BeatMaker.vst3" "$OUT/"
          if [ -d "build/HipHopBeatMaker_artefacts/Release/AU" ]; then
            cp -R "build/HipHopBeatMaker_artefacts/Release/AU/Hip-Hop BeatMaker.component" "$OUT/"
          fi
          if [ -d "build/HipHopBeatMaker_artefacts/Release/Standalone" ]; then
            cp -R build/HipHopBeatMaker_artefacts/Release/Standalone/* "$OUT/"
          fi
          cp README.md "$OUT/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$OUT.zip" "$OUT" > /dev/null
          else
            ditto -c -k --keepParent "$OUT" "$OUT.zip"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: HipHopBeatMaker-${{ matrix.name }}
          path: HipHopBeatMaker-${{ matrix.name }}.zip

  # Rolling "latest" release: every push to main replaces the downloads
  latest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish "Neueste Version"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release delete latest --repo "$REPO" --cleanup-tag --yes || true
          gh release create latest dist/*.zip --repo "$REPO" --target "$GITHUB_SHA" \
            --title "Neueste Version ($(date -u +%Y-%m-%d) · ${GITHUB_SHA::7})" \
            --notes "Automatischer Build vom letzten Stand auf main. Windows: VST3 + Standalone (.exe). macOS: VST3 + AU + Standalone (.app)." \
            --latest

  # Versioned release when a tag v* is pushed
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
