name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
          - os: ubuntu-22.04
            name: Linux-x64
          - os: ubuntu-22.04
            name: Linux-ARM64
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.4-${{ matrix.name }}

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A x64

      - name: Configure (macOS universal)
        if: runner.os == 'macOS'
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: ./Scripts/setup-linux-deps.sh ${{ matrix.name == 'Linux-ARM64' && 'arm64' || 'x64' }}

      - name: Configure (Linux x64)
        if: matrix.name == 'Linux-x64'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DHHBM_BUILD_TESTS=ON

      - name: Plugin metadata from native x64 build (Linux ARM64)
        if: matrix.name == 'Linux-ARM64'
        timeout-minutes: 30
        run: |
          cmake -S . -B build-meta -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-meta --target HipHopBeatMaker_VST3 HipHopBeatMaker_LV2 --parallel 4

      - name: Configure (Linux ARM64, cross)
        if: matrix.name == 'Linux-ARM64'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=Scripts/toolchain-linux-arm64.cmake

      - name: Build
        timeout-minutes: 45
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --config Release --parallel 4 2>&1 | tee build.log || {
            grep -iE "error|failed|not found|no such file|exec format" build.log | grep -v "^--" | head -20 | sed 's/^/::error::/'
            exit 1
          }

      - name: Copy plugin metadata (Linux ARM64)
        if: matrix.name == 'Linux-ARM64'
        shell: bash
        run: |
          set -e
          M=build-meta/HipHopBeatMaker_artefacts/Release
          R=build/HipHopBeatMaker_artefacts/Release
          cp "$M/LV2/Hip-Hop BeatMaker.lv2/"*.ttl "$R/LV2/Hip-Hop BeatMaker.lv2/"
          mkdir -p "$R/VST3/Hip-Hop BeatMaker.vst3/Contents/Resources"
          cp "$M/VST3/Hip-Hop BeatMaker.vst3/Contents/Resources/moduleinfo.json" "$R/VST3/Hip-Hop BeatMaker.vst3/Contents/Resources/"
          ls -R "$R/LV2" "$R/VST3"

      - name: Tests (Linux x64)
        if: matrix.name == 'Linux-x64'
        run: |
          sudo apt-get install -y -q xvfb > /dev/null
          ./build/HHBMRenderTest_artefacts/Release/HHBMRenderTest ./render
          xvfb-run -a ./build/HHBMProcessorTest_artefacts/Release/HHBMProcessorTest

      - name: Check architecture (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          R=build/HipHopBeatMaker_artefacts/Release
          for b in "$R/Standalone/Hip-Hop BeatMaker" "$R/VST3/Hip-Hop BeatMaker.vst3/Contents/"*-linux/*.so "$R/LV2/Hip-Hop BeatMaker.lv2/"*.so; do
            file -L "$b"
            if [ "${{ matrix.name }}" = "Linux-ARM64" ]; then file -L "$b" | grep -q aarch64; else file -L "$b" | grep -q x86-64; fi
          done
          test -f "$R/LV2/Hip-Hop BeatMaker.lv2/dsp.ttl"

      - name: Check architectures (Intel + Apple Silicon)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          for b in "build/HipHopBeatMaker_artefacts/Release/Standalone/Hip-Hop BeatMaker.app/Contents/MacOS/Hip-Hop BeatMaker" \
                   "build/HipHopBeatMaker_artefacts/Release/VST3/Hip-Hop BeatMaker.vst3/Contents/MacOS/Hip-Hop BeatMaker" \
                   "build/HipHopBeatMaker_artefacts/Release/AU/Hip-Hop BeatMaker.component/Contents/MacOS/Hip-Hop BeatMaker"; do
            lipo -info "$b"
            lipo -info "$b" | grep -q x86_64
            lipo -info "$b" | grep -q arm64
            # minimum macOS of the binary must be 11.x
            vtool -show-build -arch x86_64 "$b" | grep -E "minos|version" | head -3
            vtool -show-build -arch x86_64 "$b" | grep -q "minos 11\."
          done
          /usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "build/HipHopBeatMaker_artefacts/Release/Standalone/Hip-Hop BeatMaker.app/Contents/Info.plist"

      - name: Package
        shell: bash
        run: |
          OUT="HipHopBeatMaker-${{ matrix.name }}"
          mkdir -p "$OUT"
          cp -R "build/HipHopBeatMaker_artefacts/Release/VST3/Hip-Hop BeatMaker.vst3" "$OUT/"
          if [ -d "build/HipHopBeatMaker_artefacts/Release/AU" ]; then
            cp -R "build/HipHopBeatMaker_artefacts/Release/AU/Hip-Hop BeatMaker.component" "$OUT/"
          fi
          if [ -d "build/HipHopBeatMaker_artefacts/Release/Standalone" ]; then
            cp -R build/HipHopBeatMaker_artefacts/Release/Standalone/* "$OUT/"
          fi
          if [ -d "build/HipHopBeatMaker_artefacts/Release/LV2" ]; then
            cp -R "build/HipHopBeatMaker_artefacts/Release/LV2/Hip-Hop BeatMaker.lv2" "$OUT/"
          fi
          cp README.md "$OUT/"
          cp Docs/Bedienungsanleitung.pdf "$OUT/"
          if [ "$RUNNER_OS" = "Linux" ]; then
            cp Packaging/linux/install.sh Packaging/linux/hiphop-beatmaker.desktop "$OUT/"
            cp Resources/icon.png "$OUT/hiphop-beatmaker.png"
            chmod +x "$OUT/install.sh" "$OUT/Hip-Hop BeatMaker"
            tar -czf "$OUT.tar.gz" "$OUT"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$OUT.zip" "$OUT" > /dev/null
          else
            ditto -c -k --keepParent "$OUT" "$OUT.zip"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: HipHopBeatMaker-${{ matrix.name }}
          path: HipHopBeatMaker-${{ matrix.name }}.*

  # Rolling "latest" release: every push to main replaces the downloads
  latest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish "Neueste Version"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release delete latest --repo "$REPO" --cleanup-tag --yes || true
          gh release create latest dist/* --repo "$REPO" --target "$GITHUB_SHA" \
            --title "Neueste Version ($(date -u +%Y-%m-%d) · ${GITHUB_SHA::7})" \
            --notes "Automatischer Build vom letzten Stand auf main. Windows: VST3 + Standalone (.exe). Bedienungsanleitung (PDF) liegt in jedem ZIP. macOS (Universal: Intel + Apple Silicon, ab macOS 11): VST3 + AU + Standalone (.app). Linux x64 + ARM64 (z. B. Raspberry Pi): VST3 + LV2 + Standalone, Installation mit ./install.sh." \
            --latest

  # Versioned release when a tag v* is pushed
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
